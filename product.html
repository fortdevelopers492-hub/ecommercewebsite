<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Product Details - Fort Mart</title>

    <!-- Constant Open Graph / Facebook Meta Tags with Proper .jpg Extension -->
    <meta property="og:type" content="product" />
    <meta property="og:title" content="Fort Mart Store - Premium Products" />
    <meta property="og:description" content="Discover premium tech, fashion, and lifestyle items with fast nationwide delivery." />
    <meta property="og:image" content="https://fortdevelopers492-hub.github.io/imagerepo/fort-mart-e-commerce-2-product-cover-photo.jpg" />
    <meta property="og:url" content="https://yourdomain.com/product.html" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fort Mart Store">
    <meta name="twitter:description" content="Discover premium tech, fashion, and lifestyle items with fast nationwide delivery.">
    <meta name="twitter:image" content="https://fortdevelopers492-hub.github.io/imagerepo/fort-mart-e-commerce-2-product-cover-photo.jpg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#0066FF',
                        brandGreen: '#00CC66',
                        brandDark: '#0f172a',
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0066FF 0%, #00CC66 100%); }
        .gradient-text {
            background: linear-gradient(135deg, #0066FF 0%, #00CC66 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center text-white font-black text-xl shadow-md group-hover:scale-105 transition-transform">
                    FM
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900">FORT<span class="gradient-text">MART</span></span>
                    <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider -mt-1">Direct Store</span>
                </div>
            </a>
            <a href="index.html" class="inline-flex items-center gap-2 text-slate-600 hover:text-brandBlue text-xs sm:text-sm font-semibold bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl transition">
                <i class="fa-solid fa-arrow-left"></i> Back to Catalog
            </a>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 space-y-8">
        
        <!-- Expanded Product Info Section -->
        <div id="productDetailCard" class="bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-slate-200/80">
            <div class="text-center py-16">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-brandBlue mb-3"></i>
                <p class="text-sm font-medium text-slate-500">Loading product information...</p>
            </div>
        </div>

        <!-- Dynamic Related Products Section -->
        <div class="space-y-4 pt-4">
            <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-brandBlue"></i> Related Products
            </h3>
            <div id="relatedProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-8 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-2">
            <p class="font-bold text-white">Fort Mart Digital Store</p>
            <p>&copy; 2026 Fort Mart Inc. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript Dynamic URL Parameter Processing -->
    <script>
        const DEFAULT_PRODUCTS = [
            {
                id: 'prod-1',
                slug: 'sony-wh-1000xm5-noise-canceling-headphones',
                name: 'Sony WH-1000XM5 Noise-Canceling Headphones',
                price: 285000,
                slashedPrice: 320000,
                category: 'Audio',
                rating: 4.9,
                stock: 12,
                urgencyBadge: 'Best Seller',
                shortDescription: 'Industry-leading noise cancellation with spectacular sound quality.',
                longDescription: 'The WH-1000XM5 headphones rewrite the rules for distraction-free listening. Two processors and 8 microphones control noise canceling for unprecedented sound clarity.',
                coverImage: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&auto=format&fit=crop&q=80',
                additionalImages: [
                    'https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=800&auto=format&fit=crop&q=80',
                    'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=800&auto=format&fit=crop&q=80'
                ],
                relatedProductIds: ['prod-2', 'prod-4']
            },
            {
                id: 'prod-2',
                slug: 'apple-watch-series-9-gps-45mm',
                name: 'Apple Watch Series 9 GPS 45mm',
                price: 410000,
                slashedPrice: 450000,
                category: 'Wearables',
                rating: 4.8,
                stock: 3,
                urgencyBadge: 'Only 3 left!',
                shortDescription: 'Powerful S9 SiP chip with double tap gesture controls.',
                longDescription: 'An indispensable companion for a healthy life is now even more powerful. The S9 SiP enables a super-bright display and a magical new way to quickly use your Apple Watch.',
                coverImage: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&auto=format&fit=crop&q=80',
                additionalImages: [
                    'https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=800&auto=format&fit=crop&q=80'
                ],
                relatedProductIds: ['prod-1', 'prod-3']
            },
            {
                id: 'prod-3',
                slug: 'macbook-air-m2-136-inch-256gb-midnight',
                name: 'MacBook Air M2 13.6-inch - 256GB Midnight',
                price: 980000,
                slashedPrice: 1100000,
                category: 'Computers',
                rating: 4.9,
                stock: 7,
                urgencyBadge: 'Hot Deal',
                shortDescription: 'Strikingly thin design with fast M2 performance.',
                longDescription: 'Redesigned around the next-generation M2 chip, MacBook Air is strikingly thin and brings exceptional speed and power efficiency inside its durable all-aluminum enclosure.',
                coverImage: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=800&auto=format&fit=crop&q=80',
                additionalImages: [
                    'https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?w=800&auto=format&fit=crop&q=80'
                ],
                relatedProductIds: ['prod-2', 'prod-4']
            },
            {
                id: 'prod-4',
                slug: 'anker-magnetic-wireless-power-bank-10000mah',
                name: 'Anker Magnetic Wireless Power Bank 10,000mAh',
                price: 42000,
                slashedPrice: 55000,
                category: 'Accessories',
                rating: 4.7,
                stock: 25,
                urgencyBadge: null,
                shortDescription: 'Snap-on wireless charger with built-in foldable stand.',
                longDescription: 'Equipped with a 10,000mAh capacity to provide up to 2 full charges for your iPhone or Android device. MagSafe compatible with strong magnet security.',
                coverImage: 'https://images.unsplash.com/photo-1609592424074-1262f2eb657c?w=800&auto=format&fit=crop&q=80',
                additionalImages: [],
                relatedProductIds: ['prod-1', 'prod-2']
            }
        ];

        const productsDatabase = JSON.parse(localStorage.getItem('fm_products')) || DEFAULT_PRODUCTS;

        window.addEventListener('DOMContentLoaded', () => {
            initProductPage();
        });

        function initProductPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const productNameParam = urlParams.get('product');

            let product = null;

            if (productId) {
                product = productsDatabase.find(p => p.id === productId || p.slug === productId);
            }
            if (!product && productNameParam) {
                const searchName = productNameParam.replaceAll('+', ' ').toLowerCase();
                product = productsDatabase.find(p => p.name.toLowerCase() === searchName || p.slug === searchName);
            }

            if (!product && productsDatabase.length > 0) {
                product = productsDatabase[0];
            }

            if (!product) {
                renderNotFound();
                return;
            }

            document.title = `${product.name} | Fort Mart`;

            renderProductDetails(product);
            renderRelatedProducts(product);
        }

        function formatPrice(amount) {
            return `₦${Number(amount).toLocaleString()}`;
        }

        function renderProductDetails(product) {
            const cardContainer = document.getElementById('productDetailCard');
            const allImages = [product.coverImage, ...(product.additionalImages || [])];
            const currentUrl = window.location.href;
            const shareText = encodeURIComponent(`Check out ${product.name} on Fort Mart for ${formatPrice(product.price)}!`);
            const encodedUrl = encodeURIComponent(currentUrl);

            cardContainer.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
                    <div class="space-y-4">
                        <div class="rounded-3xl overflow-hidden bg-slate-100 border border-slate-200/80 relative shadow-inner">
                            <img id="mainDisplayImage" src="${product.coverImage}" alt="${product.name}" class="w-full h-80 sm:h-96 object-cover transition-opacity duration-300">
                            ${product.urgencyBadge ? `<span class="absolute top-4 left-4 bg-red-500 text-white font-extrabold text-xs uppercase px-3 py-1 rounded-lg shadow-md">${product.urgencyBadge}</span>` : ''}
                        </div>
                        ${allImages.length > 1 ? `
                            <div class="flex gap-3 overflow-x-auto pb-2">
                                ${allImages.map((img, idx) => `
                                    <img src="${img}" alt="Thumbnail ${idx}" onclick="changeMainImage('${img}')" class="w-20 h-20 object-cover rounded-2xl border-2 border-slate-200 cursor-pointer hover:border-brandBlue transition shadow-sm">
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <div class="space-y-6">
                        <div class="flex items-center gap-3">
                            <span class="bg-blue-50 text-brandBlue text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${product.category}</span>
                            <span class="text-xs font-bold text-amber-500 bg-amber-50 px-3 py-1 rounded-full">
                                <i class="fa-solid fa-star me-1"></i>${product.rating || '5.0'} Rating
                            </span>
                        </div>

                        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 leading-tight">${product.name}</h1>

                        <div class="p-5 rounded-3xl bg-slate-50 border border-slate-200/80 flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <span class="text-xs text-slate-400 font-bold uppercase tracking-wider block">Price</span>
                                <div class="text-3xl sm:text-4xl font-black text-slate-900">${formatPrice(product.price)}</div>
                                ${product.slashedPrice ? `<span class="text-xs text-slate-400 line-through">${formatPrice(product.slashedPrice)}</span>` : ''}
                            </div>
                            <button onclick="handleAddToCart('${product.id}')" class="gradient-bg hover:opacity-95 text-white font-extrabold px-8 py-4 rounded-2xl shadow-xl transition text-sm flex items-center gap-2">
                                <i class="fa-solid fa-bag-shopping"></i> Add to Cart
                            </button>
                        </div>

                        <div class="space-y-3">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Product Overview</h3>
                            <p class="text-sm text-slate-600 leading-relaxed">${product.longDescription || product.shortDescription}</p>
                        </div>

                        <!-- Custom Social Share Buttons Bar -->
                        <div class="pt-4 border-t border-slate-100 space-y-2">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Share This Product</span>
                            <div class="flex flex-wrap items-center gap-3">
                                <!-- WhatsApp Share -->
                                <a href="https://api.whatsapp.com/send?text=${shareText}%20${encodedUrl}" target="_blank" rel="noopener noreferrer" class="bg-[#25D366] hover:bg-[#20ba5a] text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
                                    <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp
                                </a>
                                <!-- Facebook Share -->
                                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}" target="_blank" rel="noopener noreferrer" class="bg-[#1877F2] hover:bg-[#1565c0] text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
                                    <i class="fa-brands fa-facebook-f text-base"></i> Facebook
                                </a>
                                <!-- Twitter / X Share -->
                                <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${encodedUrl}" target="_blank" rel="noopener noreferrer" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
                                    <i class="fa-brands fa-x-twitter text-base"></i> Twitter
                                </a>
                                <!-- Copy Link Button -->
                                <button onclick="copyProductLink()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
                                    <i class="fa-solid fa-link text-base"></i> Copy Link
                                </button>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex items-center gap-4 text-xs font-semibold text-slate-500">
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-truck-fast text-brandGreen"></i> Nationwide Shipping</span>
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-brandBlue"></i> Verified Guarantee</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function copyProductLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('Product link copied to clipboard!');
            });
        }

        function changeMainImage(imgUrl) {
            const mainImg = document.getElementById('mainDisplayImage');
            if (mainImg) mainImg.src = imgUrl;
        }

        function renderRelatedProducts(currentProduct) {
            const relatedGrid = document.getElementById('relatedProductsGrid');
            const relatedIds = currentProduct.relatedProductIds || [];
            
            let list = productsDatabase.filter(p => relatedIds.includes(p.id) && p.id !== currentProduct.id);

            if (list.length === 0) {
                list = productsDatabase.filter(p => p.id !== currentProduct.id).slice(0, 4);
            }

            if (list.length === 0) {
                relatedGrid.innerHTML = `<p class="text-xs text-slate-400 col-span-full">No related items available.</p>`;
                return;
            }

            relatedGrid.innerHTML = list.map(p => {
                const shareableUrl = `product.html?product=${encodeURIComponent(p.name)}&id=${p.id}`;
                return `
                    <div class="bg-white rounded-3xl border border-slate-200/80 p-4 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group">
                        <a href="${shareableUrl}">
                            <div class="relative mb-3 overflow-hidden rounded-2xl bg-slate-100">
                                <img src="${p.coverImage}" alt="${p.name}" class="w-full h-44 object-cover group-hover:scale-105 transition-transform duration-500">
                            </div>
                            <div class="space-y-1">
                                <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">${p.category}</span>
                                <h4 class="font-bold text-slate-900 text-sm group-hover:text-brandBlue line-clamp-2 transition">${p.name}</h4>
                            </div>
                        </a>
                        <div class="pt-3 mt-2 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-sm font-black text-slate-900">${formatPrice(p.price)}</span>
                            <a href="${shareableUrl}" class="bg-slate-100 hover:bg-brandBlue hover:text-white text-slate-700 font-bold px-3 py-1.5 rounded-xl transition text-xs">
                                View
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleAddToCart(productId) {
            let cart = JSON.parse(localStorage.getItem('fm_cart')) || [];
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: productId, qty: 1 });
            }
            localStorage.setItem('fm_cart', JSON.stringify(cart));
            alert('Product added to cart!');
        }

        function renderNotFound() {
            document.getElementById('productDetailCard').innerHTML = `
                <div class="text-center py-16 space-y-3">
                    <i class="fa-solid fa-box-open text-5xl text-slate-300"></i>
                    <h2 class="text-xl font-bold text-slate-800">Product Not Found</h2>
                    <p class="text-xs text-slate-500">The product you are looking for does not exist or has been removed.</p>
                    <a href="index.html" class="inline-block bg-brandBlue text-white text-xs font-bold px-5 py-2.5 rounded-xl">Return to Shop</a>
                </div>
            `;
        }
    </script>
</body>
</html>
